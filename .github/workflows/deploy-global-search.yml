name: Deploy Global Search

# One workflow per plugin; the `paths` filter keeps them independent, so a push
# touching plugins/global-search never redeploys the other plugins.
#
# Two destinations on the same server (one SFTP account, two WordPress installs):
#   staging     stage.commissioncu.org   deploys automatically on every push to
#                                         the `staging` branch
#   production  commissioncu.org         manual only: Actions tab -> Run workflow
#                                         -> target "production", and only when
#                                         run from `main`
# Nothing reaches production from a push. Promote by merging staging into main,
# testing on staging, then running this workflow by hand against production.
on:
  push:
    branches:
      - staging
    paths:
      - 'plugins/global-search/**'
      - '.github/workflows/deploy-global-search.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy (production only from main)
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-global-search
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A push can only mean staging. A manual run picks its target, and
      # production is refused unless it runs from main, so an unreviewed branch
      # can never be shipped to the live site by hand either.
      - name: Pick the destination
        id: dest
        env:
          TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
        run: |
          case "$TARGET" in
            staging)    root='stage.commissioncu.org/wp-content/plugins' ;;
            production)
              if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
                echo "Production deploys only run from main (this run is on $GITHUB_REF)." >&2
                exit 1
              fi
              root='public_html/wp-content/plugins' ;;
            *) echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac
          echo "Deploying plugins/global-search to $TARGET ($root)"
          echo "remote_path=$root/global-search" >> "$GITHUB_OUTPUT"

      # Everything dev-only (.git, .github, .claude, .gitignore) lives at the
      # repository root, outside the plugin directory, so local_path already
      # excludes it. Only the built zip and macOS cruft remain.
      - name: Strip dev-only files before deploy
        run: |
          rm -rf plugins/global-search/docs/downloads
          find plugins/global-search -name '.DS_Store' -delete

      # `put -r` will not create its destination, and sftp_only: true stops the
      # action from creating it either, so a plugin's first deploy to a
      # destination has nowhere to land. The leading dash on -mkdir tells sftp
      # to carry on when the directory is already there. BatchMode=no and
      # PreferredAuthentications=password are what let sshpass answer the
      # prompt (-b implies BatchMode=yes, which disables password auth).
      - name: Ensure the remote directory exists
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_PATH: ${{ steps.dest.outputs.remote_path }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SFTP_PASSWORD" sftp \
            -o StrictHostKeyChecking=no \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "$SFTP_PORT" -b - "$SFTP_USERNAME@$SFTP_HOST" <<SFTP
          -mkdir $REMOTE_PATH
          bye
          SFTP

      - name: Deploy to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './plugins/global-search/*'
          remote_path: ${{ steps.dest.outputs.remote_path }}
          sftp_only: true
